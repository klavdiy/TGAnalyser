name: Collect rank snapshot

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: collect-rank
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_API_ID_2: ${{ secrets.TG_API_ID_2 }}
      TG_API_HASH_2: ${{ secrets.TG_API_HASH_2 }}
    steps:
      - name: Check secrets
        env:
          S1: ${{ secrets.TELEGRAM_SESSION_B64 }}
          S2: ${{ secrets.TELEGRAM_SESSION_2_B64 }}
        run: |
          if [ -z "$S2" ] && [ -z "$S1" ]; then
            echo 'Missing session secret'
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore sessions
        env:
          TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION_B64 }}
          TELEGRAM_SESSION_2_B64: ${{ secrets.TELEGRAM_SESSION_2_B64 }}
        run: |
          if [ -n "$TELEGRAM_SESSION_B64" ]; then
            printf '%s' "$TELEGRAM_SESSION_B64" | base64 -d > analyser_session.session
          fi
          if [ -n "$TELEGRAM_SESSION_2_B64" ]; then
            printf '%s' "$TELEGRAM_SESSION_2_B64" | base64 -d > analyser_session_2.session
          fi

      - name: Restore previous sqlite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          RUN_ID=$(gh run list --workflow "Collect rank snapshot" --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --name rank-sqlite --dir data || true
          fi

      - name: Collect watchlist
        run: python collect_rank.py --only-panel --delay 1.2

      - name: Export
        run: python rank_export.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank-sqlite
          path: data/rank.sqlite
          if-no-files-found: ignore
          retention-days: 90

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank-export
          path: TGSpyder_Output/rank/
          if-no-files-found: ignore
          retention-days: 90
